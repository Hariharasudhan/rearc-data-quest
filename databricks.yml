# ==============================================================================
# DATABRICKS ASSET BUNDLE DEFINITION FOR REARC DATA QUEST
# ==============================================================================
bundle:
  name: rearc-data-quest

# Define targets for cross-environment deployments (Dev / Prod execution models)
targets:
  dev:
    workspace:
      # Enter your Databricks Workspace base deployment URL here
      host: https://dbc-a1d25508-ad4e.cloud.databricks.com
    mode: development

resources:
  pipelines:
    # --------------------------------------------------------------------------
    # 1. Delta Live Tables / Lakeflow Pipeline Configuration
    # --------------------------------------------------------------------------
    rearc_medallion_pipeline:
      name: rearc_medallion_dlt_pipeline
      target: default # Target Schema destination namespace
      catalog: rearc  # Target Catalog destination namespace
      edition: advanced # Advanced is mandatory to enable DLT Data Quality Expectations
      libraries:
        - notebook:
            path: ./src/rearc_dlt_pipeline.py
      development: true
      serverless: true

  jobs:
    # --------------------------------------------------------------------------
    # 2. Master Orchestration Workflow Job
    # --------------------------------------------------------------------------
    rearc_orchestration_job:
      name: rearc_master_orchestration_job
      tasks:
        # Task 1: Execute Pure Python Ingestion Script to fetch BLS and Population Data
        - task_key: step1_ingestion_task
          environment_key: default
          spark_python_task:
            python_file: ./src/step1_ingestion.py
            
        # Task 2: Trigger Delta Live Tables processing after Ingestion finishes
        - task_key: step2_dlt_pipeline_task
          depends_on:
            - task_key: step1_ingestion_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.rearc_medallion_pipeline.id}

      environments:
        - environment_key: default
          spec:
            environment_version: '2'

